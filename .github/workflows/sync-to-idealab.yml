name: Sync to IDEA LAB repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-to-idealab
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == 'sunwoong-yang/wing_aero_foundation'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push main to IDEA LAB repository
        env:
          MIRROR_TOKEN: ${{ secrets.WING_AERO_FOUNDATION_MIRROR }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "WING_AERO_FOUNDATION_MIRROR is not configured yet; skipping synchronization."
            exit 0
          fi

          git remote add idealab "https://idealabHYU:${MIRROR_TOKEN}@github.com/idealabHYU/wing_aero_foundation.git"

          set +e
          push_output=$(git push idealab HEAD:main 2>&1)
          push_status=$?
          set -e

          {
            echo "### IDEA LAB mirror push"
            echo '```text'
            echo "$push_output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "$push_output"
          exit "$push_status"
